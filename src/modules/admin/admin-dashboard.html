<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Kingdom Wars — Admin</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a14; color: #e0e0e0; min-height: 100vh; }
  .login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .login-box { background: #111827; border: 1px solid #2d3748; border-radius: 16px; padding: 40px; width: 100%; max-width: 360px; text-align: center; }
  .login-box h1 { font-size: 24px; color: #f4d03f; margin-bottom: 8px; }
  .login-box p { color: #666; font-size: 13px; margin-bottom: 24px; }
  input { width: 100%; padding: 12px 16px; background: #1a2236; border: 1px solid #2d3748; border-radius: 10px; color: #fff; font-size: 14px; margin-bottom: 12px; outline: none; }
  input:focus { border-color: #f4d03f; }
  .btn { width: 100%; padding: 13px; background: linear-gradient(135deg,#f39c12,#f4d03f); border: none; border-radius: 10px; color: #000; font-size: 15px; font-weight: 800; cursor: pointer; }
  .btn:hover { opacity: 0.9; }
  .btn-sm { padding: 6px 14px; font-size: 12px; border-radius: 8px; border: none; cursor: pointer; font-weight: 700; }
  .btn-danger { background: #e74c3c; color: #fff; }
  .btn-success { background: #27ae60; color: #fff; }
  .btn-info { background: #3498db; color: #fff; }
  .dashboard { display: none; padding: 20px; max-width: 1100px; margin: 0 auto; }
  .header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; background: #111827; border-bottom: 1px solid #1e2a3a; margin: -20px -20px 24px; }
  .header h1 { font-size: 20px; color: #f4d03f; }
  .logout { background: none; border: 1px solid #444; color: #888; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin-bottom: 28px; }
  .stat-card { background: #111827; border: 1px solid #1e2a3a; border-radius: 12px; padding: 18px; text-align: center; }
  .stat-card .val { font-size: 32px; font-weight: 900; color: #f4d03f; }
  .stat-card .lbl { font-size: 12px; color: #666; margin-top: 4px; }
  .section { background: #111827; border: 1px solid #1e2a3a; border-radius: 12px; overflow: hidden; margin-bottom: 20px; }
  .section-header { padding: 14px 18px; border-bottom: 1px solid #1e2a3a; font-weight: 700; font-size: 14px; color: #a0aec0; display: flex; justify-content: space-between; align-items: center; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { padding: 10px 14px; text-align: right; color: #666; font-weight: 600; border-bottom: 1px solid #1e2a3a; }
  td { padding: 10px 14px; border-bottom: 1px solid #0d1520; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(244,208,63,0.03); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 700; }
  .badge-green { background: rgba(39,174,96,0.2); color: #27ae60; }
  .badge-red { background: rgba(231,76,60,0.2); color: #e74c3c; }
  .badge-blue { background: rgba(52,152,219,0.2); color: #3498db; }
  .actions { display: flex; gap: 6px; }
  .error { color: #e74c3c; text-align: center; padding: 12px; }
  .loading { text-align: center; color: #666; padding: 40px; }
  .give-gems-form { display: flex; gap: 8px; align-items: center; }
  .give-gems-form input { width: 80px; margin: 0; padding: 6px 10px; font-size: 12px; }
  .refresh-btn { background: none; border: 1px solid #2d3748; color: #888; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; }
  .refresh-btn:hover { border-color: #f4d03f; color: #f4d03f; }
</style>
</head>
<body>

<!-- Login -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <h1>⚔️ Admin Panel</h1>
    <p>Kingdom Wars Management</p>
    <input type="password" id="secretInput" placeholder="Admin Secret..." onkeydown="if(event.key==='Enter')doLogin()"/>
    <button class="btn" onclick="doLogin()">🔐 כניסה</button>
    <p id="loginError" style="color:#e74c3c;margin-top:12px;font-size:12px;"></p>
  </div>
</div>

<!-- Dashboard -->
<div class="dashboard" id="dashboard">
  <div class="header">
    <h1>⚔️ Kingdom Wars — Admin Dashboard</h1>
    <div style="display:flex;gap:10px;align-items:center;">
      <span id="lastRefresh" style="color:#555;font-size:12px;"></span>
      <button class="refresh-btn" onclick="loadAll()">🔄 רענן</button>
      <button class="logout" onclick="logout()">יציאה</button>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats-grid" id="statsGrid">
    <div class="loading">טוען...</div>
  </div>

  <!-- Users table -->
  <div class="section">
    <div class="section-header">
      👥 משתמשים (50 אחרונים)
      <button class="refresh-btn" onclick="loadUsers()">🔄</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>שם</th>
          <th>Telegram ID</th>
          <th>שפה</th>
          <th>ניקוד</th>
          <th>Gems</th>
          <th>תנאים</th>
          <th>כניסה אחרונה</th>
          <th>פעולות</th>
        </tr>
      </thead>
      <tbody id="usersTable"><tr><td colspan="8" class="loading">טוען...</td></tr></tbody>
    </table>
  </div>

  <!-- Top kingdoms -->
  <div class="section">
    <div class="section-header">🏆 טופ ממלכות</div>
    <table>
      <thead>
        <tr><th>מקום</th><th>ממלכה</th><th>שחקן</th><th>ניקוד</th><th>Gems</th><th>זהב</th></tr>
      </thead>
      <tbody id="topTable"><tr><td colspan="6" class="loading">טוען...</td></tr></tbody>
    </table>
  </div>
</div>

<script>
let SECRET = '';
const API = 'https://kingdomwars.cloud/api/admin';

function headers() { return { 'x-admin-secret': SECRET, 'Content-Type': 'application/json' }; }

async function doLogin() {
  SECRET = document.getElementById('secretInput').value;
  try {
    const r = await fetch(API + '/stats', { headers: headers() });
    if (r.status === 401) { document.getElementById('loginError').textContent = '❌ סיסמה שגויה'; return; }
    const data = await r.json();
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    renderStats(data);
    loadUsers();
  } catch(e) { document.getElementById('loginError').textContent = '❌ שגיאת חיבור'; }
}

async function loadAll() {
  const r = await fetch(API + '/stats', { headers: headers() });
  const data = await r.json();
  renderStats(data);
  loadUsers();
  document.getElementById('lastRefresh').textContent = 'עודכן: ' + new Date().toLocaleTimeString('he');
}

function renderStats(data) {
  document.getElementById('statsGrid').innerHTML = `
    <div class="stat-card"><div class="val">${data.totalUsers}</div><div class="lbl">סה"כ משתמשים</div></div>
    <div class="stat-card"><div class="val">${data.activeUsers7d}</div><div class="lbl">פעילים 7 ימים</div></div>
    <div class="stat-card"><div class="val" style="color:#27ae60">${data.newUsersToday}</div><div class="lbl">חדשים היום</div></div>
    <div class="stat-card"><div class="val" style="color:#9b59b6">${data.totalGemsInGame}</div><div class="lbl">Gems בשוק</div></div>
    <div class="stat-card"><div class="val">${data.totalKingdoms}</div><div class="lbl">ממלכות פעילות</div></div>
  `;

  document.getElementById('topTable').innerHTML = data.topKingdoms.map((k, i) => `
    <tr>
      <td><strong style="color:#f4d03f">#${i+1}</strong></td>
      <td>${k.name}</td>
      <td style="color:#888">@${k.username || '?'}</td>
      <td><strong>${k.score.toLocaleString()}</strong></td>
      <td style="color:#9b59b6">💎 ${k.gems}</td>
      <td style="color:#f4d03f">💰 ${k.gold.toLocaleString()}</td>
    </tr>
  `).join('');
}

async function loadUsers() {
  const r = await fetch(API + '/users', { headers: headers() });
  const users = await r.json();
  document.getElementById('usersTable').innerHTML = users.map(u => `
    <tr>
      <td><strong>${u.name || '?'}</strong></td>
      <td style="color:#666;font-size:11px">${u.telegramId}</td>
      <td>${u.language || 'en'}</td>
      <td>${u.score > 0 ? '<strong style="color:#f4d03f">' + u.score + '</strong>' : '<span style="color:#444">0</span>'}</td>
      <td style="color:#9b59b6">💎 ${u.gems}</td>
      <td>${u.termsAccepted ? '<span class="badge badge-green">✓</span>' : '<span class="badge badge-red">✗</span>'}</td>
      <td style="color:#555;font-size:11px">${u.lastLogin ? new Date(u.lastLogin).toLocaleDateString('he') : 'אף פעם'}</td>
      <td>
        <div class="actions">
          <div class="give-gems-form">
            <input type="number" id="gems_${u.telegramId}" value="100" min="1" max="9999"/>
            <button class="btn-sm btn-success" onclick="giveGems('${u.telegramId}')">💎 תן</button>
          </div>
          <button class="btn-sm btn-danger" onclick="banUser('${u.telegramId}','${u.name}')">🚫 חסום</button>
        </div>
      </td>
    </tr>
  `).join('');
}

async function giveGems(telegramId) {
  const gems = parseInt(document.getElementById('gems_' + telegramId).value);
  if (!gems || gems < 1) return;
  if (!confirm('לתת ' + gems + ' Gems ל-' + telegramId + '?')) return;
  const r = await fetch(API + '/give-gems/' + telegramId, {
    method: 'POST', headers: headers(),
    body: JSON.stringify({ gems })
  });
  const d = await r.json();
  if (d.success) alert('✅ ניתן! יתרה חדשה: ' + d.newGems + ' Gems');
  else alert('❌ שגיאה: ' + JSON.stringify(d));
}

async function banUser(telegramId, name) {
  if (!confirm('לחסום את ' + name + ' (' + telegramId + ')?\n⚠️ פעולה זו לא ניתנת לביטול!')) return;
  const r = await fetch(API + '/ban/' + telegramId, { method: 'POST', headers: headers() });
  const d = await r.json();
  if (d.banned) { alert('✅ משתמש חסום'); loadUsers(); }
  else alert('❌ שגיאה');
}

function logout() { SECRET = ''; document.getElementById('loginScreen').style.display = 'flex'; document.getElementById('dashboard').style.display = 'none'; }

// Auto-refresh every 60 seconds
setInterval(() => { if (SECRET) loadAll(); }, 60000);
</script>
</body>
</html>
